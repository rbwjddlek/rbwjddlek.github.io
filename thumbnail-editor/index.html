<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>유튜브 섬네일 편집기</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #111;
      color: #eee;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
    }

    .wrap {
      max-width: 1500px;
      margin: 0 auto;
      padding: 20px;
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 18px;
    }

    h1 { margin: 0 0 6px; font-size: 26px; }
    p { margin: 0 0 16px; color: #aaa; }
    h3 { margin: 20px 0 10px; font-size: 16px; color: #fff; border-bottom: 1px solid #444; padding-bottom: 6px; }
    h3:first-child { margin-top: 0; }

    .preview {
      background: #1d1d1d;
      border: 1px solid #333;
      border-radius: 14px;
      padding: 12px;
      position: sticky;
      top: 20px;
    }

    canvas {
      width: 100%;
      display: block;
      border-radius: 10px;
      background: #222;
    }

    .buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    button, label.fileBtn {
      border: 0;
      border-radius: 10px;
      padding: 11px 14px;
      background: #f5f5f5;
      color: #111;
      font-weight: 800;
      cursor: pointer;
      font-size: 14px;
    }

    button.secondary {
      background: #444;
      color: #eee;
    }

    .panel {
      background: #1d1d1d;
      border: 1px solid #333;
      border-radius: 14px;
      padding: 16px;
      height: fit-content;
    }

    .field { margin-bottom: 14px; }
    .field span {
      display: flex;
      justify-content: space-between;
      color: #ccc;
      font-size: 13px;
      margin-bottom: 6px;
    }

    textarea, select, input[type="text"], input[type="number"] {
      width: 100%;
      background: #101010;
      color: #eee;
      border: 1px solid #444;
      border-radius: 10px;
      padding: 9px;
      font-size: 14px;
    }

    textarea { height: 80px; resize: vertical; }
    input[type="range"] { width: 100%; }
    input[type="color"] {
      width: 100%; height: 42px; background: #101010;
      border: 1px solid #444; border-radius: 10px; padding: 4px;
    }

    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    .divider { border-top: 1px solid #333; padding-top: 14px; margin-top: 12px; }
    em { font-style: normal; color: #aaa; }

    @media (max-width: 1000px) {
      .wrap { grid-template-columns: 1fr; }
      .preview { position: static; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <main>
      <h1>유튜브 섬네일 편집기</h1>
      <p>이미지 업로드 → 문구 조정 → 1280×720 PNG 다운로드</p>

      <div class="preview">
        <canvas id="canvas" width="1280" height="720"></canvas>
        <div class="buttons">
          <label class="fileBtn">
            이미지 넣기
            <input id="file" type="file" accept="image/*" hidden />
          </label>
          <button id="download">PNG 다운로드</button>
          <button id="reset" class="secondary">초기화</button>
        </div>
      </div>
    </main>

    <aside class="panel">
      <div class="grid2">
        <div class="field">
          <span>폰트</span>
          <select id="fontFamily">
            <option>Arial Black</option>
            <option>Impact</option>
            <option>Malgun Gothic</option>
            <option>sans-serif</option>
            <option>serif</option>
          </select>
        </div>
        <div class="field">
          <span>정렬</span>
          <select id="textAlign">
            <option value="left">왼쪽</option>
            <option value="center">가운데</option>
            <option value="right">오른쪽</option>
          </select>
        </div>
      </div>
      <div id="commonSliders"></div>

      <h3>문구 1 (메인)</h3>
      <div class="field">
        <textarea id="text1">어쨌든
마이클 잭슨이라는 이름은
다시 알렸쥬?</textarea>
      </div>
      <div class="field">
        <span>강조할 구문 (,로 구분)</span>
        <input id="accentKeywords1" type="text" value="마이클 잭슨,다시 알렸쥬" />
      </div>
      <div id="sliders1"></div>
      <div class="grid3">
        <div class="field"><span>글자색</span><input id="fillColor1" type="color" value="#ffffff" /></div>
        <div class="field"><span>강조색</span><input id="accentColor1" type="color" value="#ffd400" /></div>
        <div class="field"><span>외곽선</span><input id="strokeColor1" type="color" value="#111111" /></div>
      </div>

      <h3>문구 2 (서브)</h3>
      <div class="field">
        <textarea id="text2">서브 텍스트 추가 가능
원하는 위치에 배치해 보세요</textarea>
      </div>
      <div class="field">
        <span>강조할 구문 (,로 구분)</span>
        <input id="accentKeywords2" type="text" value="서브 텍스트" />
      </div>
      <div id="sliders2"></div>
      <div class="grid3">
        <div class="field"><span>글자색</span><input id="fillColor2" type="color" value="#ffffff" /></div>
        <div class="field"><span>강조색</span><input id="accentColor2" type="color" value="#00ffcc" /></div>
        <div class="field"><span>외곽선</span><input id="strokeColor2" type="color" value="#111111" /></div>
      </div>

      <h3>배경 효과</h3>
      <div id="effectSliders"></div>
    </aside>
  </div>

  <script>
    const CANVAS_W = 1280;
    const CANVAS_H = 720;
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let img = null;

    const state = {
      // 공통 설정
      fontFamily: 'Arial Black',
      textAlign: 'left',
      lineHeight: 1.18,
      strokeWidth: 10,
      shadowBlur: 10,
      brightness: 1.05,
      contrast: 1.08,
      vignette: 0.35,

      // 문구 1
      text1: document.getElementById('text1').value,
      accentKeywords1: document.getElementById('accentKeywords1').value,
      fontSize1: 78,
      x1: 48,
      y1: 86,
      fillColor1: '#ffffff',
      accentColor1: '#ffd400',
      strokeColor1: '#111111',

      // 문구 2
      text2: document.getElementById('text2').value,
      accentKeywords2: document.getElementById('accentKeywords2').value,
      fontSize2: 46,
      x1: 48, // 기본 x좌표
      y1: 86,
      x2: 48,
      y2: 480,
      fillColor2: '#ffffff',
      accentColor2: '#00ffcc',
      strokeColor2: '#111111'
    };

    const commonDefs = [
      ['lineHeight', '줄 간격', 0.8, 1.8, 0.01],
      ['strokeWidth', '외곽선 두께', 0, 28, 1],
      ['shadowBlur', '그림자', 0, 40, 1]
    ];

    const slider1Defs = [
      ['fontSize1', '글자 크기', 24, 140, 1],
      ['x1', 'X 위치', 0, 1200, 1],
      ['y1', 'Y 위치', 0, 720, 1]
    ];

    const slider2Defs = [
      ['fontSize2', '글자 크기', 24, 140, 1],
      ['x2', 'X 위치', 0, 1200, 1],
      ['y2', 'Y 위치', 0, 720, 1]
    ];

    const effectDefs = [
      ['brightness', '밝기', 0.5, 1.8, 0.01],
      ['contrast', '대비', 0.5, 1.8, 0.01],
      ['vignette', '비네팅', 0, 0.8, 0.01]
    ];

    function makeSlider(parentId, defs) {
      const parent = document.getElementById(parentId);
      defs.forEach(([key, label, min, max, step]) => {
        const div = document.createElement('div');
        div.className = 'field';
        div.innerHTML = `
          <span><b>${label}</b><em id="${key}Val">${formatValue(state[key], step)}</em></span>
          <input id="${key}" type="range" min="${min}" max="${max}" step="${step}" value="${state[key]}" />
        `;
        parent.appendChild(div);

        const input = div.querySelector('input');
        const val = div.querySelector('em');

        input.addEventListener('input', () => {
          state[key] = Number(input.value);
          val.textContent = formatValue(state[key], step);
          draw();
        });
      });
    }

    function formatValue(value, step) {
      return step < 1 ? Number(value).toFixed(2) : value;
    }

    makeSlider('commonSliders', commonDefs);
    makeSlider('sliders1', slider1Defs);
    makeSlider('sliders2', slider2Defs);
    makeSlider('effectSliders', effectDefs);

    function bind(id, key) {
      const el = document.getElementById(id);
      if (!el) return;
      el.addEventListener('input', () => { state[key] = el.value; draw(); });
      el.addEventListener('change', () => { state[key] = el.value; draw(); });
    }

    const textBinds = [
      'fontFamily', 'textAlign', 
      'text1', 'accentKeywords1', 'fillColor1', 'accentColor1', 'strokeColor1',
      'text2', 'accentKeywords2', 'fillColor2', 'accentColor2', 'strokeColor2'
    ];
    textBinds.forEach(id => bind(id, id));

    document.getElementById('file').addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      const url = URL.createObjectURL(file);
      const image = new Image();
      image.onload = () => { img = image; URL.revokeObjectURL(url); draw(); };
      image.src = url;
    });

    document.getElementById('download').addEventListener('click', () => {
      const a = document.createElement('a');
      a.download = 'youtube-thumbnail.png';
      a.href = canvas.toDataURL('image/png');
      a.click();
    });

    document.getElementById('reset').addEventListener('click', () => location.reload());

    function drawCoverImage(image) {
      const canvasRatio = CANVAS_W / CANVAS_H;
      const imgRatio = image.width / image.height;
      let sx, sy, sw, sh;

      if (imgRatio > canvasRatio) {
        sh = image.height;
        sw = image.height * canvasRatio;
        sx = (image.width - sw) / 2;
        sy = 0;
      } else {
        sw = image.width;
        sh = image.width / canvasRatio;
        sx = 0;
        sy = (image.height - sh) / 2;
      }

      ctx.save();
      ctx.filter = `brightness(${state.brightness}) contrast(${state.contrast})`;
      ctx.drawImage(image, sx, sy, sw, sh, 0, 0, CANVAS_W, CANVAS_H);
      ctx.restore();
    }

    function drawVignette() {
      const g = ctx.createRadialGradient(
        CANVAS_W * 0.55, CANVAS_H * 0.45, CANVAS_W * 0.15,
        CANVAS_W * 0.5, CANVAS_H * 0.5, CANVAS_W * 0.78
      );
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(1, `rgba(0,0,0,${state.vignette})`);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
    }

    function wrapLine(line, maxWidth) {
      const chars = [...line];
      const result = [];
      let current = '';

      for (const ch of chars) {
        const test = current + ch;
        if (ctx.measureText(test).width > maxWidth && current) {
          result.push(current);
          current = ch;
        } else {
          current = test;
        }
      }
      if (current) result.push(current);
      return result;
    }

    function renderTextLayer(textStr, accentStr, fontSize, startX, startY, fillC, accentC, strokeC) {
      if (!textStr.trim()) return;

      ctx.save();
      ctx.font = `900 ${fontSize}px "${state.fontFamily}", Impact, sans-serif`;
      ctx.textBaseline = 'top';
      ctx.textAlign = state.textAlign;
      ctx.lineJoin = 'round';
      ctx.shadowColor = 'rgba(0,0,0,0.85)';
      ctx.shadowBlur = state.shadowBlur;
      ctx.shadowOffsetX = 4;
      ctx.shadowOffsetY = 4;

      const maxWidth = CANVAS_W - startX - 50;
      const lines = textStr.split('\n').flatMap(line => wrapLine(line, maxWidth));
      const lh = fontSize * state.lineHeight;

      const accentList = accentStr.split(',').map(v => v.trim()).filter(v => v.length > 0);

      lines.forEach((line, i) => {
        const tx = state.textAlign === 'center' ? CANVAS_W / 2 
                 : state.textAlign === 'right' ? CANVAS_W - startX : startX;
        const ty = startY + i * lh;
        const accent = accentList.some(keyword => line.includes(keyword));

        ctx.strokeStyle = strokeC;
        ctx.lineWidth = state.strokeWidth;
        ctx.strokeText(line, tx, ty);

        ctx.fillStyle = accent ? accentC : fillC;
        ctx.fillText(line, tx, ty);
      });

      ctx.restore();
    }

    function draw() {
      ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);

      if (img) {
        drawCoverImage(img);
      } else {
        const g = ctx.createLinearGradient(0, 0, CANVAS_W, CANVAS_H);
        g.addColorStop(0, '#111827');
        g.addColorStop(1, '#3f3f46');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.font = '700 42px sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText('이미지를 넣으면 여기에 표시됨', 60, 330);
      }

      drawVignette();
      
      // 문구 1 렌더링
      renderTextLayer(
        state.text1, state.accentKeywords1, state.fontSize1, 
        state.x1, state.y1, state.fillColor1, state.accentColor1, state.strokeColor1
      );

      // 문구 2 렌더링
      renderTextLayer(
        state.text2, state.accentKeywords2, state.fontSize2, 
        state.x2, state.y2, state.fillColor2, state.accentColor2, state.strokeColor2
      );
    }

    draw();
  </script>
</body>
</html>
